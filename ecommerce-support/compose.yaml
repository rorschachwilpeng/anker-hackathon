name: ecommerce-support-ch02
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ecommerce_support
      MYSQL_USER: support
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
volumes:
  mysql_data:

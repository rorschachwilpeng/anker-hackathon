<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知遇 · 智能客服</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/chat.css"><script src="/static/chat.js" defer></script>
</head>
<body>
<div class="workspace">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="知遇首页"><span class="brand-symbol">知</span><span>知遇 <small>智能客服</small></span></a>
    <button class="new-chat" id="new-chat"><span aria-hidden="true">＋</span> 新对话</button>
    <div class="nav-label">工作空间</div>
    <nav aria-label="功能导航">
      <button class="nav-item selected" id="chat-mode" aria-current="page"><span aria-hidden="true">◌</span> 客服对话 <span class="nav-arrow" aria-hidden="true">↗</span></button>
      <button class="nav-item" id="extract-mode"><span aria-hidden="true">▤</span> 售后提取</button>
    </nav>
    <div class="sidebar-note"><span class="note-label">让沟通更简单</span><p>从一个问题开始，<br>一起找到解决办法。</p></div>
    <div class="sidebar-foot"><span class="avatar">我</span><span>本地工作空间<small>对话仅保留在当前页面</small></span></div>
  </aside>
  <main>
    <header><div><span id="page-title">客服对话</span><span class="header-tag">AI 助手</span></div><span class="status" id="connection" role="status">正在连接</span></header>
    <section class="scroll-area" id="scroll-area" aria-label="对话内容">
      <div class="welcome" id="welcome">
        <div class="eyebrow">YOUR EVERYDAY SUPPORT</div>
        <div class="welcome-mark" aria-hidden="true">✳</div>
        <h1 id="welcome-title">每一个问题，<br>都值得认真回应。</h1>
        <p id="welcome-description">退换货、物流、售后咨询，告诉我你遇到了什么。</p>
        <div class="suggestions" id="suggestions">
          <button data-prompt="收到的衣服尺码小了，我想换大一码，需要提供哪些信息？"><span>退换货咨询</span><small>尺码不合适，该怎么办？</small><b aria-hidden="true">↗</b></button>
          <button data-prompt="我的包裹物流三天没有更新了，我可以怎么处理？"><span>物流问题</span><small>包裹迟迟没到，想了解进度</small><b aria-hidden="true">↗</b></button>
          <button data-prompt="商品收到后发现有破损，我应该准备哪些售后材料？"><span>售后帮助</span><small>商品有问题，了解处理方式</small><b aria-hidden="true">↗</b></button>
        </div>
      </div>
      <div class="messages" id="messages" role="log" aria-label="聊天消息" aria-live="polite" aria-relevant="additions"></div>
    </section>
    <div class="composer-area">
      <form id="composer" class="composer">
        <label class="sr-only" for="message">输入消息</label>
        <textarea id="message" rows="2" maxlength="16000" placeholder="说说你的问题，我来帮你一起解决…"></textarea>
        <div class="composer-bottom"><span id="input-hint">Enter 发送 · Shift + Enter 换行</span><button id="send" type="submit" disabled aria-label="发送消息">发送 <span aria-hidden="true">↑</span></button><button id="stop" type="button" hidden>停止生成 <span aria-hidden="true">■</span></button></div>
      </form>
      <div class="footnote">AI 回复仅供参考，实际售后处理请以商家确认为准。</div>
      <div class="sr-only" id="announcement" role="status"></div>
    </div>
  </main>
</div>
<dialog id="source-dialog" class="source-dialog" aria-labelledby="source-title">
  <div class="source-head"><span>知识来源</span><button type="button" id="source-close" aria-label="关闭来源">×</button></div>
  <h2 id="source-title"></h2><p id="source-path"></p><div id="source-content" class="source-content"></div>
</dialog>
<script>document.getElementById('source-close').onclick=()=>document.getElementById('source-dialog').close();</script>
</body>
</html>

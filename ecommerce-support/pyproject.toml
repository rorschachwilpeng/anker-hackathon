[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-support"
version = "0.1.0"
description = "Streaming ecommerce customer-support API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "httpx",
  "langchain-core",
  "langchain-openai",
  "pydantic-settings",
  "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
